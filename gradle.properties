# Evita proxies del sistema/IE y fuerza IPv4 (útil con VPNs Fortinet/Cisco que rompen DNS o rutas IPv6).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.useSystemProxies=false -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# AdMob y política de privacidad (reemplazá IDs de prueba antes de publicar en Play Store)
# IDs de prueba de Google (válidos solo para desarrollo):
ADMOB_APP_ID=ca-app-pub-3940256099942544~3347511713
ADMOB_BANNER_UNIT_ID=ca-app-pub-3940256099942544/6300978111
# URL pública (GitHub Pages — activar en Settings → Pages → /docs)
PRIVACY_POLICY_URL=https://juanfrancisconardi.github.io/ConcursosAye/privacy.html
