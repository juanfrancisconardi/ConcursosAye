# Evita proxies del sistema/IE y fuerza IPv4 (útil con VPNs Fortinet/Cisco que rompen DNS o rutas IPv6).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.useSystemProxies=false -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
